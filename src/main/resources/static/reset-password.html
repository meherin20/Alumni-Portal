<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password · Alumni Management Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css" />
    <style>
        body { font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
</head>
<body>
<div class="page-shell">
    <header class="app-nav">
        <div class="app-nav-left">
            <div class="app-logo">AP</div>
            <div class="app-brand">
                <div class="app-brand-title">Alumni Management Portal</div>
                <div class="app-brand-sub">Reset your password</div>
            </div>
        </div>
        <nav class="app-nav-links">
            <a href="/" class="app-nav-link">Home</a>
            <a href="/login.html" class="app-nav-link">Back to login</a>
            <button type="button" id ="theme-toggle" class="btn-ghost" style="margin-left:8px;" aria-label="Change theme">
                <span id="theme-toggle-icon">🌙</span>
            </button>
        </nav>
    </header>

    <main class="scene-card">
        <header class="scene-header">
            <div>
                <div class="scene-title">Reset your password</div>
                <p class="scene-subtitle">
                    Enter your account email and choose a new password. This works for both students and alumni.
                </p>
            </div>
            <span class="scene-badge">Security</span>
        </header>

        <div class="scene-body">
            <div class="form-card">
                <div class="section-label">Account details</div>
                <form id="reset-form">
                    <div class="form-row">
                        <label for="email">Email</label>
                        <input id="email" name="email" type="email" placeholder="you@example.edu" required />
                    </div>
                    <div class="form-row-inline">
                        <div class="form-row">
                            <label for="password">New password</label>
                            <input id="password" name="password" type="password" required />
                        </div>
                        <div class="form-row">
                            <label for="confirmPassword">Confirm new password</label>
                            <input id="confirmPassword" name="confirmPassword" type="password" required />
                        </div>
                    </div>
                    <div class="btn-row">
                        <button type="submit" class="btn">Reset password</button>
                        <a href="/login.html" class="btn-ghost">Cancel</a>
                    </div>
                    <div id="reset-message" class="alert" style="display:none;"></div>
                </form>
            </div>
        </div>
    </main>
</div>

<script>
    (function() {
        const stored = window.localStorage.getItem('amp-theme');
        if (stored === 'light') {
            document.body.setAttribute('data-theme', 'light');
        }
        const btn = document.getElementById('theme-toggle');
        const icon = document.getElementById('theme-toggle-icon');
        if (!btn || !icon) return;
        function syncIcon() {
            const isLight = document.body.getAttribute('data-theme') === 'light';
            icon.textContent = isLight ? '☀' : '🌙';
        }
        syncLabel = syncIcon;
        syncIcon();
        btn.addEventListener('click', () => {
            const isLight = document.body.getAttribute('data-theme') === 'light';
            if (isLight) {
                document.body.removeAttribute('data-theme');
                window.localStorage.setItem('amp-theme', 'dark');
            } else {
                document.body.setAttribute('data-theme', 'light');
                window.localStorage.setItem('amp-theme', 'light');
            }
            syncIcon();
        });
    })();

    const form = document.getElementById('reset-form');
    const msg = document.getElementById('reset-message');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        msg.style.display = 'none';

        if (form.password.value !== form.confirmPassword.value) {
            msg.className = 'alert alert-error';
            msg.textContent = 'Passwords do not match.';
            msg.style.display = 'block';
            return;
        }

        const payload = {
            email: form.email.value,
            password: form.password.value
        };

        try {
            const res = await fetch('/users/reset-password', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json().catch(() => ({}));
            msg.className = 'alert';
            if (!res.ok) {
                msg.classList.add('alert-error');
                msg.textContent = data.message || 'Password reset failed.';
            } else {
                msg.textContent = data.message || 'Password updated. You can now log in with the new password.';
            }
            msg.style.display = 'block';
        } catch (err) {
            msg.className = 'alert alert-error';
            msg.textContent = 'Network error. Is the backend running?';
            msg.style.display = 'block';
        }
    });
</script>
</body>
</html>
