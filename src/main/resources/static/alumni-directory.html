<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alumni Directory · Alumni Management Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/styles.css" />
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #8b5cf6;
            --accent: #f59e0b;
            --success: #10b981;
            --error: #ef4444;
            --bg-primary: #0f0f23;
            --bg-secondary: #1a1a2e;
            --bg-glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.5);
            --radius-sm: 8px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-xl: 32px;
            --shadow-sm: 0 4px 16px rgba(0, 0, 0, 0.1);
            --shadow-md: 0 8px 32px rgba(0, 0, 0, 0.2);
            --shadow-lg: 0 16px 64px rgba(0, 0, 0, 0.3);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --gradient-primary: linear-gradient(135deg, var(--primary), var(--secondary));
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 25%, #16213e 50%, #0f0f23 75%, #1a1a2e 100%);
            background-attachment: fixed;
            color: var(--text-primary);
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 20% 80%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(6, 182, 212, 0.1) 0%, transparent 50%);
            z-index: -1;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(15, 15, 35, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem 0;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #1e40af 0%, #1d4ed8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .nav-link.active {
            color: #1e40af;
        }

        .main-content {
            padding: 8rem 2rem 4rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .page-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .page-title {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 900;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
        }

        .page-subtitle {
            font-size: 1.25rem;
            color: var(--text-secondary);
            max-width: 700px;
            margin: 0 auto;
        }

        .search-section {
            background: var(--bg-glass);
            backdrop-filter: blur(25px);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            padding: 2.5rem;
            margin-bottom: 3rem;
            box-shadow: var(--shadow-md);
        }

        .search-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-label {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .form-input {
            padding: 0.875rem 1rem;
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 0.9rem;
            transition: var(--transition);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        .search-btn {
            grid-column: 1 / -1;
            padding: 1rem 2rem;
            background: var(--gradient-primary);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .alumni-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
        }

        .alumni-card {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            padding: 2rem;
            transition: var(--transition);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .alumni-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.08), transparent);
            transition: left 0.6s ease;
        }

        .alumni-card:hover::before {
            left: 100%;
        }

        .alumni-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-lg);
            border-color: rgba(99, 102, 241, 0.3);
        }

        .alumni-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .alumni-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--gradient-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
            flex-shrink: 0;
        }

        .alumni-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .alumni-info {
            flex: 1;
        }

        .alumni-name {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.25rem;
        }

        .alumni-title {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .alumni-details {
            margin-bottom: 1.5rem;
        }

        .detail-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .detail-item i {
            width: 16px;
            color: var(--primary);
        }

        .alumni-actions {
            display: flex;
            gap: 0.75rem;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            flex: 1;
        }

        .btn-primary {
            background: var(--gradient-primary);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-success {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .btn-success:hover {
            background: rgba(16, 185, 129, 0.3);
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            grid-column: 1 / -1;
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .empty-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .empty-message {
            color: var(--text-secondary);
        }

        @media (max-width: 768px) {
            .alumni-grid {
                grid-template-columns: 1fr;
            }

            .search-form {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/dashboard.html" class="nav-logo">Alumni Portal</a>
            <div class="nav-links">
                <a href="/dashboard.html" class="nav-link">Dashboard</a>
                <a href="/alumni-directory.html" class="nav-link active">Alumni Directory</a>
                <a href="/events.html" class="nav-link">Events</a>
                <a href="/jobs.html" class="nav-link">Jobs</a>
                <a href="/news.html" class="nav-link">News</a>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="page-header">
            <h1 class="page-title">Alumni Directory</h1>
            <p class="page-subtitle">Connect with alumni from your university. Search and connect with professionals in your field.</p>
        </div>

        <div class="search-section">
            <form class="search-form" id="search-form">
                <div class="form-group">
                    <label class="form-label" for="name">Name</label>
                    <input type="text" id="name" name="name" class="form-input" placeholder="Search by name..." />
                </div>
                <div class="form-group">
                    <label class="form-label" for="department">Department</label>
                    <input type="text" id="department" name="department" class="form-input" placeholder="e.g. Computer Science" />
                </div>
                <div class="form-group">
                    <label class="form-label" for="graduationYear">Graduation Year</label>
                    <input type="text" id="graduationYear" name="graduationYear" class="form-input" placeholder="e.g. 2020" />
                </div>
                <div class="form-group">
                    <label class="form-label" for="jobTitle">Job Title</label>
                    <input type="text" id="jobTitle" name="jobTitle" class="form-input" placeholder="e.g. Software Engineer" />
                </div>
                <div class="form-group">
                    <label class="form-label" for="company">Company</label>
                    <input type="text" id="company" name="company" class="form-input" placeholder="e.g. Google" />
                </div>
                <button type="submit" class="search-btn">
                    <i class="fas fa-search"></i>
                    Search Alumni
                </button>
            </form>
        </div>

        <div class="alumni-grid" id="alumni-grid">
            <div class="empty-state">
                <div class="empty-icon">👥</div>
                <h3 class="empty-title">Start Your Search</h3>
                <p class="empty-message">Use the search form above to find alumni by name, department, graduation year, job title, or company.</p>
            </div>
        </div>
    </main>

    <script>
        let currentUserEmail = null;

        // Get current user email from localStorage
        try {
            currentUserEmail = localStorage.getItem('amp-user-email');
        } catch (e) {
            console.error('Error getting user email:', e);
        }

        async function searchAlumni() {
            const form = document.getElementById('search-form');
            const formData = new FormData(form);
            
            const params = new URLSearchParams();
            if (formData.get('name')) params.append('name', formData.get('name'));
            if (formData.get('department')) params.append('department', formData.get('department'));
            if (formData.get('graduationYear')) params.append('graduationYear', formData.get('graduationYear'));
            if (formData.get('jobTitle')) params.append('jobTitle', formData.get('jobTitle'));
            if (formData.get('company')) params.append('company', formData.get('company'));

            const grid = document.getElementById('alumni-grid');
            grid.innerHTML = '<div class="empty-state"><div class="empty-icon">⏳</div><h3 class="empty-title">Searching...</h3></div>';

            try {
                const response = await fetch(`/api/alumni-directory/search?${params.toString()}`);
                const data = await response.json().catch(() => ({}));

                if (!response.ok) {
                    const errorMsg = data.message || data.error || 'Failed to load alumni data.';
                    console.error('API Error:', errorMsg, data);
                    grid.innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><h3 class="empty-title">Error Loading Alumni</h3><p class="empty-message">${errorMsg}</p></div>`;
                    return;
                }

                if (data.data && Array.isArray(data.data)) {
                    renderAlumni(data.data);
                } else {
                    grid.innerHTML = '<div class="empty-state"><div class="empty-icon">👥</div><h3 class="empty-title">No Alumni Found</h3><p class="empty-message">Try adjusting your search criteria.</p></div>';
                }
            } catch (error) {
                console.error('Error searching alumni:', error);
                grid.innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><h3 class="empty-title">Error Loading Alumni Data</h3><p class="empty-message">${error.message || 'Failed to search alumni. Please try again.'}</p></div>`;
            }
        }

        async function renderAlumni(alumniList) {
            const grid = document.getElementById('alumni-grid');

            if (!alumniList.length) {
                grid.innerHTML = '<div class="empty-state"><div class="empty-icon">👥</div><h3 class="empty-title">No Alumni Found</h3><p class="empty-message">Try adjusting your search criteria.</p></div>';
                return;
            }

            try {
                grid.innerHTML = await Promise.all(alumniList.map(async (alumni, index) => {
                    try {
                        const connectionStatus = currentUserEmail && alumni.email
                            ? await checkConnectionStatus(currentUserEmail, alumni.email)
                            : { connected: false, canMessage: false, status: null };

                        const initials = `${alumni.firstName?.[0] || ''}${alumni.lastName?.[0] || ''}`.toUpperCase();
                        const fullName = `${alumni.firstName || 'Unknown'} ${alumni.lastName || ''}`.trim() || 'Alumni';

                        let actionButton = '';
                        if (connectionStatus.status === 'ACCEPTED') {
                            actionButton = `<button class="btn btn-success" onclick="event.stopPropagation(); openMessage('${alumni.email || ''}')"><i class="fas fa-envelope"></i> Message</button>`;
                        } else if (connectionStatus.status === 'PENDING') {
                            actionButton = `<button class="btn btn-secondary" disabled><i class="fas fa-clock"></i> Pending</button>`;
                        } else if (connectionStatus.status === 'BLOCKED') {
                            actionButton = `<button class="btn btn-secondary" disabled><i class="fas fa-ban"></i> Blocked</button>`;
                        } else {
                            actionButton = `<button class="btn btn-primary" onclick="event.stopPropagation(); sendConnectionRequest('${alumni.email || ''}')"><i class="fas fa-user-plus"></i> Add</button>`;
                        }

                        return `
                            <div class="alumni-card" onclick="viewProfile(${alumni.id})" style="animation-delay: ${index * 0.1}s;">
                                <div class="alumni-header">
                                    <div class="alumni-avatar">
                                        ${alumni.profileImage 
                                            ? `<img src="${alumni.profileImage}" alt="${fullName}" onerror="this.parentElement.textContent='${initials}'" />` 
                                            : initials}
                                    </div>
                                    <div class="alumni-info">
                                        <div class="alumni-name">${fullName}</div>
                                        <div class="alumni-title">${alumni.jobTitle || 'Alumni'}</div>
                                    </div>
                                </div>
                                <div class="alumni-details">
                                    ${alumni.department ? `<div class="detail-item"><i class="fas fa-graduation-cap"></i><span>${alumni.department}</span></div>` : ''}
                                    ${alumni.passingYear ? `<div class="detail-item"><i class="fas fa-calendar"></i><span>Graduated ${alumni.passingYear}</span></div>` : ''}
                                    ${alumni.company ? `<div class="detail-item"><i class="fas fa-building"></i><span>${alumni.company}</span></div>` : ''}
                                    ${!alumni.department && !alumni.passingYear && !alumni.company ? '<div class="detail-item"><i class="fas fa-info-circle"></i><span>Profile not yet completed</span></div>' : ''}
                                </div>
                                <div class="alumni-actions" onclick="event.stopPropagation();">
                                    ${actionButton}
                                    <button class="btn btn-secondary" onclick="event.stopPropagation(); viewProfile(${alumni.id})">
                                        <i class="fas fa-eye"></i> View
                                    </button>
                                </div>
                            </div>
                        `;
                    } catch (err) {
                        console.error(`Error rendering alumni ${alumni.id}:`, err);
                        return `<div class="alumni-card"><div class="empty-state"><p>Error loading alumni data</p></div></div>`;
                    }
                })).then(html => html.join(''));
            } catch (error) {
                console.error('Error rendering alumni list:', error);
                grid.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><h3 class="empty-title">Error</h3><p class="empty-message">Failed to render alumni data.</p></div>';
            }
        }

        async function checkConnectionStatus(studentEmail, alumniEmail) {
            try {
                const response = await fetch(`/api/alumni-directory/check-connection?studentEmail=${encodeURIComponent(studentEmail)}&alumniEmail=${encodeURIComponent(alumniEmail)}`);
                const data = await response.json();
                return data.data || { connected: false, canMessage: false, status: null };
            } catch (error) {
                console.error('Error checking connection status:', error);
                return { connected: false, canMessage: false, status: null };
            }
        }

        async function sendConnectionRequest(alumniEmail) {
            if (!currentUserEmail) {
                alert('Please login to send connection requests.');
                return;
            }

            try {
                const response = await fetch('/friend-requests', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        studentEmail: currentUserEmail,
                        alumniEmail: alumniEmail
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    alert('Connection request sent successfully!');
                    searchAlumni(); // Refresh the list
                } else {
                    alert(data.message || 'Failed to send connection request.');
                }
            } catch (error) {
                console.error('Error sending connection request:', error);
                alert('Failed to send connection request. Please try again.');
            }
        }

        function viewProfile(alumniId) {
            if (alumniId) {
                window.location.href = `/alumni-profile.html?id=${alumniId}`;
            } else {
                alert('Invalid alumni ID');
            }
        }

        function openMessage(alumniEmail) {
            if (alumniEmail) {
                window.location.href = `/messages.html?recipient=${encodeURIComponent(alumniEmail)}`;
            } else {
                alert('Alumni email not available');
            }
        }

        document.getElementById('search-form').addEventListener('submit', (e) => {
            e.preventDefault();
            searchAlumni();
        });

        // Load all alumni on page load
        searchAlumni();
    </script>
</body>
</html>
