<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Messages · Alumni Management Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #8b5cf6;
            --accent: #f59e0b;
            --success: #10b981;
            --error: #ef4444;
            --bg-primary: #0f0f23;
            --bg-secondary: #1a1a2e;
            --bg-glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.5);
            --radius-sm: 8px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --shadow-sm: 0 4px 16px rgba(0, 0, 0, 0.1);
            --shadow-md: 0 8px 32px rgba(0, 0, 0, 0.2);
            --shadow-lg: 0 16px 64px rgba(0, 0, 0, 0.3);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 25%, #16213e 50%, #0f0f23 75%, #1a1a2e 100%);
            background-attachment: fixed;
            color: var(--text-primary);
            overflow-x: hidden;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 20% 80%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(139, 92, 246, 0.15) 0%, transparent 50%);
            z-index: -1;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            min-height: 100vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius-md);
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            font-size: 0.875rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
        }

        .btn-secondary {
            background: var(--bg-glass);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .messages-container {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 2rem;
            box-shadow: var(--shadow-lg);
        }

        .recipient-info {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: 1.5rem;
        }

        .recipient-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
        }

        .recipient-details h3 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 600;
        }

        .recipient-details p {
            margin: 0.25rem 0 0 0;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .messages-list {
            height: 500px;
            overflow-y: auto;
            padding: 1rem 0;
            margin-bottom: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .messages-list::-webkit-scrollbar {
            width: 8px;
        }

        .messages-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }

        .messages-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        .messages-list::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .message {
            display: flex;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.sent {
            justify-content: flex-end;
        }

        .message.received {
            justify-content: flex-start;
        }

        .message-bubble {
            max-width: 70%;
            padding: 1rem 1.25rem;
            border-radius: var(--radius-md);
            position: relative;
            word-wrap: break-word;
        }

        .message.sent .message-bubble {
            background: #7c4dff;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.received .message-bubble {
            background: #2a2a3e;
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }

        .message-content {
            margin: 0;
            line-height: 1.6;
        }

        .message-time {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 0.5rem;
            display: block;
        }
        
        .message.sent .message-time {
            text-align: right;
        }
        
        .message.received .message-time {
            text-align: left;
        }

        .message-sender {
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
            color: var(--text-secondary);
        }

        .message-form {
            display: flex;
            gap: 1rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
        }

        .message-input {
            flex: 1;
            padding: 1rem 1.25rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 1rem;
            font-family: inherit;
            resize: none;
            min-height: 60px;
            max-height: 150px;
            transition: var(--transition);
        }

        .message-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .message-input::placeholder {
            color: var(--text-muted);
        }

        .send-btn {
            padding: 1rem 2rem;
            background: linear-gradient(135deg, var(--success), #059669);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 4px 16px rgba(16, 185, 129, 0.3);
        }

        .send-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(16, 185, 129, 0.4);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-secondary);
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 1.125rem;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--error);
            padding: 1rem;
            border-radius: var(--radius-md);
            margin-bottom: 1rem;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            .message-bubble {
                max-width: 85%;
            }

            .message-form {
                flex-direction: column;
            }

            .send-btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-envelope"></i> Messages</h1>
            <a href="#" id="back-link" class="btn btn-secondary" onclick="history.back(); return false;">
                <i class="fas fa-arrow-left"></i> Back
            </a>
        </div>

        <div class="messages-container">
            <div id="error-message" class="error-message" style="display: none;"></div>
            
            <div id="recipient-info" class="recipient-info" style="display: none;">
                <div class="recipient-avatar" id="recipient-avatar">A</div>
                <div class="recipient-details">
                    <h3 id="recipient-name">Loading...</h3>
                    <p id="recipient-email">Loading...</p>
                </div>
            </div>

            <div id="messages-list" class="messages-list">
                <div class="loading">
                    <i class="fas fa-spinner fa-spin"></i> Loading messages...
                </div>
            </div>

            <form id="message-form" class="message-form">
                <textarea 
                    id="message-input" 
                    class="message-input" 
                    placeholder="Type your message here..."
                    rows="2"
                    required
                ></textarea>
                <button type="submit" class="send-btn" id="send-btn">
                    <i class="fas fa-paper-plane"></i> Send
                </button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script>
        (async function initMessages() {
        // Get recipient email and sender email from URL
        const urlParams = new URLSearchParams(window.location.search);
        const recipientEmail = urlParams.get('recipient');
        const senderEmailParam = urlParams.get('sender');
        
        // Get current user email from localStorage, URL parameter, or prompt
        let currentUserEmail = senderEmailParam || localStorage.getItem('amp-user-email');
        if (!currentUserEmail) {
            currentUserEmail = prompt('Please enter your email address:');
            if (currentUserEmail) {
                localStorage.setItem('amp-user-email', currentUserEmail);
            }
        }

        if (!recipientEmail) {
            document.getElementById('error-message').style.display = 'block';
            document.getElementById('error-message').textContent = 'No recipient specified. Please go back and select an alumni to message.';
            return;
        }

        if (!currentUserEmail) {
            document.getElementById('error-message').style.display = 'block';
            document.getElementById('error-message').textContent = 'Please enter your email address to send messages.';
            return;
        }

        let recipientName = '';
        let currentUserName = '';
        let conversation = [];
        let stompClient = null;
        let socketConnected = false;
        
        // Mock data for testing - replace with real API calls later
        const mockMessages = [
            {
                id: 1,
                senderEmail: recipientEmail,
                senderName: 'Alumni User',
                recipientEmail: currentUserEmail,
                content: 'Hello! How are you doing?',
                createdDate: new Date(Date.now() - 3600000).toISOString() // 1 hour ago
            },
            {
                id: 2,
                senderEmail: currentUserEmail,
                senderName: 'Me',
                recipientEmail: recipientEmail,
                content: 'Hi! I\'m doing great, thanks for asking. How about you?',
                createdDate: new Date(Date.now() - 3300000).toISOString() // 55 minutes ago
            },
            {
                id: 3,
                senderEmail: recipientEmail,
                senderName: 'Alumni User',
                recipientEmail: currentUserEmail,
                content: 'That\'s wonderful to hear! I\'m doing well too. Would you like to connect about potential opportunities?',
                createdDate: new Date(Date.now() - 3000000).toISOString() // 50 minutes ago
            },
            {
                id: 4,
                senderEmail: currentUserEmail,
                senderName: 'Me',
                recipientEmail: recipientEmail,
                content: 'Absolutely! I\'d love to learn more about your experience.',
                createdDate: new Date(Date.now() - 2700000).toISOString() // 45 minutes ago
            }
        ];

        function buildTopic(email) {
            return `/topic/messages.${email}`;
        }

        function connectSocket() {
            return new Promise((resolve, reject) => {
                try {
                    const socket = new SockJS('/ws');
                    stompClient = Stomp.over(socket);
                    stompClient.debug = null;
                    stompClient.connect({}, () => {
                        socketConnected = true;
                        const destination = buildTopic(currentUserEmail);
                        stompClient.subscribe(destination, (message) => {
                            try {
                                const payload = JSON.parse(message.body);
                                handleIncomingMessage(payload);
                            } catch (err) {
                                console.error('Failed to parse socket message:', err);
                            }
                        });
                        resolve();
                    }, (err) => {
                        socketConnected = false;
                        reject(err);
                    });
                } catch (err) {
                    socketConnected = false;
                    reject(err);
                }
            });
        }

        function handleIncomingMessage(message) {
            if (!message || !message.senderEmail || !message.recipientEmail) {
                return;
            }
            const belongsToConversation =
                (message.senderEmail === currentUserEmail && message.recipientEmail === recipientEmail) ||
                (message.senderEmail === recipientEmail && message.recipientEmail === currentUserEmail);
            if (!belongsToConversation) {
                return;
            }

            const isSender = message.senderEmail === currentUserEmail;
            if (isSender) {
                const tempIndex = conversation.findIndex((m) =>
                    m.clientTempId &&
                    m.senderEmail === message.senderEmail &&
                    m.recipientEmail === message.recipientEmail &&
                    m.content === message.content
                );
                if (tempIndex !== -1) {
                    conversation[tempIndex] = message;
                } else {
                    conversation.push(message);
                }
            } else {
                const alreadyExists = conversation.some((m) => m.id && m.id === message.id);
                if (!alreadyExists) {
                    conversation.push(message);
                }
            }

            conversation.sort((a, b) => new Date(a.createdDate) - new Date(b.createdDate));
            renderMessages(conversation);
        }

        function sendMessageSocket(payload) {
            if (!stompClient || !socketConnected) {
                return false;
            }
            stompClient.send('/app/messages.send', {}, JSON.stringify(payload));
            return true;
        }

        // Load recipient info and conversation
        async function loadConversation() {
            const messagesList = document.getElementById('messages-list');
            const errorMessage = document.getElementById('error-message');
            
            try {
                // Show loading state
                messagesList.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading messages...</div>';
                
                // Load recipient info
                try {
                    const recipientResponse = await fetch(`/users/by-email?email=${encodeURIComponent(recipientEmail)}`);
                    const recipientData = await recipientResponse.json();
                    
                    if (recipientData.data) {
                        recipientName = `${recipientData.data.firstName || ''} ${recipientData.data.lastName || ''}`.trim() || recipientEmail;
                        document.getElementById('recipient-name').textContent = recipientName;
                        document.getElementById('recipient-email').textContent = recipientEmail;
                        document.getElementById('recipient-avatar').textContent = recipientName.charAt(0).toUpperCase();
                        document.getElementById('recipient-info').style.display = 'flex';
                    } else {
                        // Use email as fallback
                        recipientName = recipientEmail;
                        document.getElementById('recipient-name').textContent = recipientEmail;
                        document.getElementById('recipient-email').textContent = recipientEmail;
                        document.getElementById('recipient-avatar').textContent = recipientEmail.charAt(0).toUpperCase();
                        document.getElementById('recipient-info').style.display = 'flex';
                    }
                } catch (err) {
                    console.warn('Error loading recipient info:', err);
                    // Use email as fallback
                    recipientName = recipientEmail;
                    document.getElementById('recipient-name').textContent = recipientEmail;
                    document.getElementById('recipient-email').textContent = recipientEmail;
                    document.getElementById('recipient-avatar').textContent = recipientEmail.charAt(0).toUpperCase();
                    document.getElementById('recipient-info').style.display = 'flex';
                }

                // Load current user info for sender name
                try {
                    const currentUserResponse = await fetch(`/users/by-email?email=${encodeURIComponent(currentUserEmail)}`);
                    const currentUserData = await currentUserResponse.json();
                    if (currentUserData.data) {
                        currentUserName = `${currentUserData.data.firstName || ''} ${currentUserData.data.lastName || ''}`.trim() || currentUserEmail;
                    } else {
                        currentUserName = currentUserEmail;
                    }
                } catch (err) {
                    console.warn('Error loading current user info:', err);
                    currentUserName = currentUserEmail;
                }

                // Load conversation - try real API first, fallback to mock data
                try {
                    const conversationResponse = await fetch(
                        `/messages/conversation?email1=${encodeURIComponent(currentUserEmail)}&email2=${encodeURIComponent(recipientEmail)}`
                    );
                    
                    if (conversationResponse.ok) {
                        const conversationData = await conversationResponse.json();
                        
                        if (conversationData && conversationData.data && conversationData.data.length > 0) {
                            conversation = conversationData.data;
                        } else {
                            // Use mock data if no real messages exist
                            conversation = mockMessages;
                        }
                    } else {
                        // Use mock data on API error
                        conversation = mockMessages;
                    }
                    
                    renderMessages(conversation);
                } catch (err) {
                    console.warn('Error loading conversation, using mock data:', err);
                    // Use mock data as fallback
                    conversation = mockMessages;
                    renderMessages(conversation);
                }

                // Always show the form, even if there's an error
                document.getElementById('message-form').style.display = 'flex';
                errorMessage.style.display = 'none';
                
            } catch (error) {
                console.error('Error loading conversation:', error);
                errorMessage.style.display = 'block';
                errorMessage.textContent = 'Failed to load conversation. You can still send messages.';
                // Still show the form so user can send messages
                document.getElementById('message-form').style.display = 'flex';
                conversation = mockMessages;
                renderMessages(conversation);
            }
        }

        // Render messages function - takes an array of message objects
        function renderMessages(messageArray = conversation) {
            const messagesList = document.getElementById('messages-list');
            
            if (!messageArray || messageArray.length === 0) {
                messagesList.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-comments"></i>
                        <p>No messages yet. Start the conversation!</p>
                    </div>
                `;
                // Scroll to bottom even for empty state
                setTimeout(() => {
                    messagesList.scrollTop = messagesList.scrollHeight;
                }, 0);
                return;
            }

            messagesList.innerHTML = messageArray.map(msg => {
                const isSent = msg.senderEmail === currentUserEmail;
                const date = new Date(msg.createdDate);
                const timeString = date.toLocaleTimeString('en-US', { 
                    hour: '2-digit', 
                    minute: '2-digit',
                    hour12: true 
                });
                
                return `
                    <div class="message ${isSent ? 'sent' : 'received'}" data-message-id="${msg.id}">
                        <div class="message-bubble">
                            ${!isSent ? `<div class="message-sender">${escapeHtml(msg.senderName || 'Alumni')}</div>` : ''}
                            <p class="message-content">${escapeHtml(msg.content)}</p>
                            <span class="message-time">${timeString}</span>
                        </div>
                    </div>
                `;
            }).join('');

            // Scroll to bottom after rendering
            setTimeout(() => {
                messagesList.scrollTop = messagesList.scrollHeight;
            }, 0);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Handle message form submission
        document.getElementById('message-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const messageInput = document.getElementById('message-input');
            const content = messageInput.value.trim();
            
            if (!content) {
                return;
            }

            const sendBtn = document.getElementById('send-btn');
            const errorMessage = document.getElementById('error-message');
            sendBtn.disabled = true;
            sendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';

            try {
                const payload = {
                    senderEmail: currentUserEmail,
                    recipientEmail: recipientEmail,
                    content: content
                };

                const tempMessage = {
                    id: Date.now(),
                    clientTempId: `tmp-${Date.now()}`,
                    senderEmail: currentUserEmail,
                    senderName: currentUserName || 'You',
                    recipientEmail: recipientEmail,
                    content: content,
                    createdDate: new Date().toISOString()
                };
                conversation.push(tempMessage);
                renderMessages(conversation);
                messageInput.value = '';
                messageInput.style.height = 'auto';
                errorMessage.style.display = 'none';

                const sentViaSocket = sendMessageSocket(payload);
                if (!sentViaSocket) {
                    const response = await fetch('/messages', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    });

                    let data;
                    try {
                        data = await response.json();
                    } catch (parseError) {
                        console.error('Failed to parse response:', parseError);
                        const text = await response.text();
                        console.error('Response text:', text);
                        throw new Error('Invalid server response');
                    }

                    console.log('Send message response:', response.status, data);

                    if (response.ok && data && data.data) {
                        const saved = data.data;
                        handleIncomingMessage(saved);
                    } else {
                        const errorMsg = data.message || data.error || 'Failed to send message. Please try again.';
                        errorMessage.style.display = 'block';
                        errorMessage.textContent = errorMsg;
                        console.error('Send message error:', errorMsg, data);
                    }
                }
            } catch (error) {
                console.error('Error sending message:', error);
                errorMessage.style.display = 'block';
                errorMessage.textContent = 'Failed to send message. Please check your connection and try again.';
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Send';
            }
        });

        // Auto-resize textarea
        const messageInput = document.getElementById('message-input');
        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 150) + 'px';
        });
        
        // Handle Enter key to send (Shift+Enter for new line)
        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                document.getElementById('message-form').dispatchEvent(new Event('submit'));
            }
        });

        // Load conversation on page load
        loadConversation();

        // Connect socket after initial data load
        connectSocket().catch((err) => {
            console.warn('Socket connection failed, falling back to REST:', err);
        });

        // Refresh conversation every 5 seconds (optional - comment out if not needed)
        // setInterval(loadConversation, 5000);
        })();

    </script>
</body>
</html>
