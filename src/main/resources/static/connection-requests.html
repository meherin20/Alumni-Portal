<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connection Requests · Alumni Management Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/styles.css" />
    <script src="/js/auth.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #8b5cf6;
            --accent: #f59e0b;
            --success: #10b981;
            --error: #ef4444;
            --bg-primary: #0f0f23;
            --bg-secondary: #1a1a2e;
            --bg-glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.5);
            --radius-sm: 8px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-xl: 32px;
            --shadow-sm: 0 4px 16px rgba(0, 0, 0, 0.1);
            --shadow-md: 0 8px 32px rgba(0, 0, 0, 0.2);
            --shadow-lg: 0 16px 64px rgba(0, 0, 0, 0.3);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --gradient-primary: linear-gradient(135deg, var(--primary), var(--secondary));
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 25%, #16213e 50%, #0f0f23 75%, #1a1a2e 100%);
            background-attachment: fixed;
            color: var(--text-primary);
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 20% 80%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(6, 182, 212, 0.1) 0%, transparent 50%);
            z-index: -1;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(15, 15, 35, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem 0;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #1e40af 0%, #1d4ed8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
        }

        .main-content {
            padding: 8rem 2rem 4rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .page-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .page-title {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 900;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
        }

        .page-subtitle {
            font-size: 1.25rem;
            color: var(--text-secondary);
            max-width: 700px;
            margin: 0 auto;
        }

        .requests-section {
            background: var(--bg-glass);
            backdrop-filter: blur(25px);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            padding: 2.5rem;
            box-shadow: var(--shadow-md);
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .section-title i {
            color: var(--primary);
        }

        .request-card {
            background: rgba(15, 23, 42, 0.3);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 2rem;
            margin-bottom: 1.5rem;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .request-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.08), transparent);
            transition: left 0.6s ease;
        }

        .request-card:hover::before {
            left: 100%;
        }

        .request-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
            border-color: rgba(99, 102, 241, 0.3);
        }

        .request-header {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .request-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--gradient-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
            flex-shrink: 0;
        }

        .request-info {
            flex: 1;
        }

        .request-name {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .request-email {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .request-date {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
        }

        .request-actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-accept {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .btn-accept:hover {
            background: rgba(16, 185, 129, 0.3);
            transform: translateY(-2px);
        }

        .btn-decline {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .btn-decline:hover {
            background: rgba(239, 68, 68, 0.3);
            transform: translateY(-2px);
        }

        .btn-block {
            background: rgba(156, 163, 175, 0.2);
            color: #9ca3af;
            border: 1px solid rgba(156, 163, 175, 0.3);
        }

        .btn-block:hover {
            background: rgba(156, 163, 175, 0.3);
            transform: translateY(-2px);
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .empty-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .empty-message {
            color: var(--text-secondary);
        }

        .status-badge {
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-pending {
            background: rgba(245, 158, 11, 0.2);
            color: #f59e0b;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .status-accepted {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/dashboard.html" class="nav-logo">Alumni Portal</a>
            <div class="nav-links">
                <a href="/dashboard.html" class="nav-link">Dashboard</a>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="page-header">
            <h1 class="page-title">Connection Requests</h1>
            <p class="page-subtitle">Manage your connection requests from students. Accept, decline, or block requests.</p>
        </div>

        <div class="requests-section">
            <h2 class="section-title">
                <i class="fas fa-user-clock"></i>
                Pending Requests
            </h2>
            <div id="pending-requests">
                <div class="empty-state">
                    <div class="empty-icon">⏳</div>
                    <h3 class="empty-title">Loading...</h3>
                </div>
            </div>
        </div>

        <div class="requests-section" style="margin-top: 2rem;">
            <h2 class="section-title">
                <i class="fas fa-user-check"></i>
                Accepted Connections
            </h2>
            <div id="accepted-requests">
                <div class="empty-state">
                    <div class="empty-icon">👥</div>
                    <h3 class="empty-title">No Accepted Connections</h3>
                    <p class="empty-message">Accepted connection requests will appear here.</p>
                </div>
            </div>
        </div>
    </main>

    <script>
    // Require alumni authentication
    if (!Auth.requireAuth('alumni')) {
        // Redirect will happen in requireAuth
        throw new Error('Authentication required');
    }
        let currentUserEmail = null;

        try {
            currentUserEmail = localStorage.getItem('amp-user-email');
        } catch (e) {
            console.error('Error getting user email:', e);
        }

        async function loadRequests() {
            if (!currentUserEmail) {
                document.getElementById('pending-requests').innerHTML = '<div class="empty-state"><div class="empty-icon">🔒</div><h3 class="empty-title">Please Login</h3><p class="empty-message">You need to be logged in to view connection requests.</p></div>';
                return;
            }

            await Promise.all([
                loadPendingRequests(),
                loadAcceptedRequests()
            ]);
        }

        async function loadPendingRequests() {
            const container = document.getElementById('pending-requests');
            container.innerHTML = '<div class="empty-state"><div class="empty-icon">⏳</div><h3 class="empty-title">Loading...</h3></div>';

            try {
                const response = await fetch(`/friend-requests/alumni?email=${encodeURIComponent(currentUserEmail)}`);
                const data = await response.json();

                if (data.data && Array.isArray(data.data) && data.data.length > 0) {
                    renderRequests(container, data.data, 'pending');
                } else {
                    container.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><h3 class="empty-title">No Pending Requests</h3><p class="empty-message">You have no pending connection requests at the moment.</p></div>';
                }
            } catch (error) {
                console.error('Error loading pending requests:', error);
                container.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><h3 class="empty-title">Error</h3><p class="empty-message">Failed to load requests. Please try again.</p></div>';
            }
        }

        async function loadAcceptedRequests() {
            const container = document.getElementById('accepted-requests');
            
            try {
                const response = await fetch(`/friend-requests/alumni/accepted?email=${encodeURIComponent(currentUserEmail)}`);
                const data = await response.json();

                if (data.data && Array.isArray(data.data) && data.data.length > 0) {
                    renderRequests(container, data.data, 'accepted');
                } else {
                    container.innerHTML = '<div class="empty-state"><div class="empty-icon">👥</div><h3 class="empty-title">No Accepted Connections</h3><p class="empty-message">Accepted connection requests will appear here.</p></div>';
                }
            } catch (error) {
                console.error('Error loading accepted requests:', error);
                container.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><h3 class="empty-title">Error</h3><p class="empty-message">Failed to load connections. Please try again.</p></div>';
            }
        }

        function renderRequests(container, requests, type) {
            container.innerHTML = requests.map((request, index) => {
                const initials = request.studentName ? request.studentName.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2) : 'ST';
                const requestDate = request.createdDate ? new Date(request.createdDate).toLocaleDateString() : '';

                if (type === 'pending') {
                    return `
                        <div class="request-card" style="animation-delay: ${index * 0.1}s;">
                            <div class="request-header">
                                <div class="request-avatar">${initials}</div>
                                <div class="request-info">
                                    <div class="request-name">${request.studentName || 'Student'}</div>
                                    <div class="request-email">${request.studentEmail || ''}</div>
                                    ${requestDate ? `<div class="request-date">Requested on ${requestDate}</div>` : ''}
                                </div>
                                <span class="status-badge status-pending">Pending</span>
                            </div>
                            <div class="request-actions">
                                <button class="btn btn-accept" onclick="acceptRequest(${request.id})">
                                    <i class="fas fa-check"></i> Accept
                                </button>
                                <button class="btn btn-decline" onclick="declineRequest(${request.id})">
                                    <i class="fas fa-times"></i> Decline
                                </button>
                                <button class="btn btn-block" onclick="blockRequest(${request.id})">
                                    <i class="fas fa-ban"></i> Block
                                </button>
                            </div>
                        </div>
                    `;
                } else {
                    return `
                        <div class="request-card" style="animation-delay: ${index * 0.1}s;">
                            <div class="request-header">
                                <div class="request-avatar">${initials}</div>
                                <div class="request-info">
                                    <div class="request-name">${request.studentName || 'Student'}</div>
                                    <div class="request-email">${request.studentEmail || ''}</div>
                                    ${requestDate ? `<div class="request-date">Connected on ${requestDate}</div>` : ''}
                                </div>
                                <span class="status-badge status-accepted">Connected</span>
                            </div>
                        </div>
                    `;
                }
            }).join('');
        }

        async function acceptRequest(requestId) {
            try {
                const response = await fetch(`/friend-requests/${requestId}/accept`, {
                    method: 'POST'
                });

                const data = await response.json();

                if (response.ok) {
                    alert('Connection request accepted!');
                    loadRequests();
                } else {
                    alert(data.message || 'Failed to accept request.');
                }
            } catch (error) {
                console.error('Error accepting request:', error);
                alert('Failed to accept request. Please try again.');
            }
        }

        async function declineRequest(requestId) {
            if (!confirm('Are you sure you want to decline this connection request?')) {
                return;
            }

            try {
                const response = await fetch(`/friend-requests/${requestId}/decline`, {
                    method: 'POST'
                });

                const data = await response.json();

                if (response.ok) {
                    alert('Connection request declined.');
                    loadRequests();
                } else {
                    alert(data.message || 'Failed to decline request.');
                }
            } catch (error) {
                console.error('Error declining request:', error);
                alert('Failed to decline request. Please try again.');
            }
        }

        async function blockRequest(requestId) {
            if (!confirm('Are you sure you want to block this user? They will not be able to send you connection requests.')) {
                return;
            }

            try {
                const response = await fetch(`/friend-requests/${requestId}/block`, {
                    method: 'POST'
                });

                const data = await response.json();

                if (response.ok) {
                    alert('User blocked successfully.');
                    loadRequests();
                } else {
                    alert(data.message || 'Failed to block user.');
                }
            } catch (error) {
                console.error('Error blocking user:', error);
                alert('Failed to block user. Please try again.');
            }
        }

        loadRequests();
    </script>
</body>
</html>
