spring.datasource.url=jdbc:mysql://localhost:3306/ea_lab?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=meherin19640

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults = false
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never


spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

server.error.include-message=always

# Change embedded server port to avoid conflicts with other apps using 8080
server.port=8081

# File upload configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Static resources configuration for file uploads
spring.web.resources.static-locations=classpath:/static/,file:uploads/